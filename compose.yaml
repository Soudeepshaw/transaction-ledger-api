# Local stack: the API on Postgres.  docker compose up --build
# POSTGRES_PASSWORD is required and is read from the environment or a .env file next to this file.
# There is no default, so no password is stored in this repository.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18 images keep data under this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.example}@db:5432/ledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # don't start until Postgres accepts connections
    restart: unless-stopped

volumes:
  pgdata:
